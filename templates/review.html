{% extends 'base.html' %}{% block content %}<h1>Manual review queue</h1>{% for r in rows %}<section><h2>{{r.filename}} - {{display.get(r.final_class,r.final_class)}}</h2><audio controls src="/audio/{{r.detection_id}}#t={{r.segment_start}},{{r.segment_end}}"></audio><p><a href="/detection/{{r.detection_id}}">View segment analysis</a></p><p>{{r.agreement_status}}; {{r.quality}}; {{r.severity}}</p><form method=post><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type=hidden name=detection_id value="{{r.detection_id}}"><label>Decision <select name="decision" required>{% for key,name in display.items() %}<option value="{{key}}">{{name}}</option>{% endfor %}</select></label><label>Comment <input name=comment></label><button>Save review</button></form></section>{% else %}<p>No pending reviews.</p>{% endfor %}{% endblock %}

{% extends 'base.html' %}
{% block content %}
<h1>Live microphone monitoring</h1>
<p id="status" role="status" aria-live="polite">Inactive. Audio is captured only after you press Start and grant permission.</p>
<button id="start">Start monitoring</button> <button id="stop" disabled>Stop</button>
<p id="result" aria-live="polite"></p><dl id="comparison"></dl>
<script>
const startButton=document.querySelector('#start'), stopButton=document.querySelector('#stop');
const statusText=document.querySelector('#status'), result=document.querySelector('#result');
const csrf={{csrf_token|tojson}};
let context, stream, source, processor, timer, chunks=[], active=false, sending=false, pending;
function wav(samples, rate) {
 const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b);let p=0;
 const text=x=>{for(let i=0;i<x.length;i++)v.setUint8(p++,x.charCodeAt(i))};
 text('RIFF');v.setUint32(p,36+samples.length*2,true);text('WAVEfmt ');v.setUint32(p,16,true);v.setUint16(p,1,true);v.setUint16(p,1,true);v.setUint32(p,rate,true);v.setUint32(p,rate*2,true);v.setUint16(p,2,true);v.setUint16(p,16,true);text('data');v.setUint32(p,samples.length*2,true);
 for(const x of samples){v.setInt16(p,Math.max(-1,Math.min(1,x))*32767,true);p+=2}return new Blob([b],{type:'audio/wav'});
}
async function sendWindow() {
 if(!active || !chunks.length)return;
 if(sending){chunks=[];statusText.textContent='Active - processing is slower than capture; a window was skipped.';return;}
 const count=chunks.reduce((n,x)=>n+x.length,0),merged=new Float32Array(count);let at=0;
 chunks.forEach(x=>{merged.set(x,at);at+=x.length});chunks=[];sending=true;pending=new AbortController();
 try {
  const form=new FormData();form.append('audio',wav(merged,context.sampleRate),'live-window.wav');
  const response=await fetch('/microphone/window',{method:'POST',body:form,headers:{'X-CSRF-Token':csrf},signal:pending.signal});
  if(!response.headers.get('content-type')?.includes('application/json'))throw Error('Session expired. Sign in again.');
  const data=await response.json();if(data.error)throw Error(data.error);if(!active)return;
  result.textContent=`${data.event} - ${data.severity} - ${data.status}. `;
  const link=document.createElement('a');link.href=data.url;link.textContent='Open analysis';result.append(link);
  const panel=document.querySelector('#comparison');panel.replaceChildren();
  for(const [label,value] of Object.entries(data.comparison||{})){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=String(value);panel.append(dt,dd);}
 } catch(e){if(e.name!=='AbortError')result.textContent=e.message;} finally {sending=false;pending=null;}
}
async function stopMonitoring(message='Paused. Microphone released.') {
 active=false;clearInterval(timer);chunks=[];pending?.abort();
 processor?.disconnect();source?.disconnect();stream?.getTracks().forEach(t=>t.stop());
 if(context && context.state!=='closed')await context.close();
 statusText.textContent=message;startButton.disabled=false;stopButton.disabled=true;
}
startButton.onclick=async()=>{
 startButton.disabled=true;
 try {
  if(!navigator.mediaDevices?.getUserMedia)throw Error('Microphone unavailable: use localhost or HTTPS.');
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const response=await fetch('/microphone/start',{method:'POST',headers:{'X-CSRF-Token':csrf}});
  if(!response.ok)throw Error('Unable to start monitoring. Reload and sign in again.');
  context=new AudioContext();await context.resume();source=context.createMediaStreamSource(stream);
  processor=context.createScriptProcessor(4096,1,1);active=true;chunks=[];
  processor.onaudioprocess=e=>{if(active)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));};
  source.connect(processor);processor.connect(context.destination);
  stream.getAudioTracks().forEach(t=>t.onended=()=>stopMonitoring('Disconnected. Microphone capture stopped.'));
  timer=setInterval(sendWindow,3000);statusText.textContent='Active - analyzing visible 3-second windows.';stopButton.disabled=false;
 } catch(e){await stopMonitoring(e.name==='NotAllowedError'?'Permission denied. Allow microphone access to monitor.':e.message);}
};
stopButton.onclick=()=>stopMonitoring();
window.addEventListener('pagehide',()=>{active=false;clearInterval(timer);pending?.abort();stream?.getTracks().forEach(t=>t.stop());context?.close();});
</script>
{% endblock %}

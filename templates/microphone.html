{% extends 'base.html' %}
{% block content %}
<h1>Live microphone monitoring</h1>
<p id="status">Inactive. Audio is only captured after you press Start and allow permission.</p>
<button id="start">Start monitoring</button> <button id="stop" disabled>Stop</button>
<p id="result"></p>
<script>
let context, stream, source, processor, chunks=[];
const status=document.querySelector('#status'), result=document.querySelector('#result');
function wav(samples, rate) { const b=new ArrayBuffer(44+samples.length*2), v=new DataView(b); let p=0; const text=x=>{for(let i=0;i<x.length;i++)v.setUint8(p++,x.charCodeAt(i))}; text('RIFF'); v.setUint32(p,36+samples.length*2,true); text('WAVEfmt '); v.setUint32(p,16,true); v.setUint16(p,1,true); v.setUint16(p,1,true); v.setUint32(p,rate,true); v.setUint32(p,rate*2,true); v.setUint16(p,2,true); v.setUint16(p,16,true); text('data'); v.setUint32(p,samples.length*2,true); for(const x of samples){v.setInt16(p,Math.max(-1,Math.min(1,x))*32767,true);p+=2} return new Blob([b],{type:'audio/wav'}) }
async function sendWindow() { if(!chunks.length)return; const count=chunks.reduce((n,x)=>n+x.length,0), merged=new Float32Array(count); let at=0; chunks.forEach(x=>{merged.set(x,at);at+=x.length}); chunks=[]; const form=new FormData(); form.append('audio',wav(merged,context.sampleRate),'live-window.wav'); const response=await fetch('/microphone/window',{method:'POST',body:form}); const data=await response.json(); if(data.error){result.textContent=data.error;return} result.innerHTML=`${data.event} - ${data.severity} - ${data.status}. <a href="${data.url}">Open analysis</a>`; }
document.querySelector('#start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});context=new AudioContext();source=context.createMediaStreamSource(stream);processor=context.createScriptProcessor(4096,1,1);processor.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));source.connect(processor);processor.connect(context.destination);window.liveTimer=setInterval(sendWindow,3000);status.textContent='Active - sending a visible 3-second window for analysis.';start.disabled=true;stop.disabled=false}catch(e){status.textContent='Permission denied or microphone unavailable.'}};
document.querySelector('#stop').onclick=async()=>{clearInterval(window.liveTimer);await sendWindow();processor.disconnect();source.disconnect();stream.getTracks().forEach(x=>x.stop());await context.close();status.textContent='Paused.';start.disabled=false;stop.disabled=true};
</script>
{% endblock %}

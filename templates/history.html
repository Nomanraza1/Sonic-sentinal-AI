{% extends 'base.html' %}{% block content %}<h1>Event history</h1><form><input name=q value="{{q}}" placeholder="Filename or sound"><select name=severity><option value="">All severities</option>{% for x in ['Informational','Low','Medium','High','Critical'] %}<option {% if severity==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><button>Filter</button></form><table><tr><th>Audio</th><th>Event</th><th>Quality</th><th>Severity</th></tr>{% for r in rows %}<tr><td><a href="/detection/{{r.detection_id}}">{{r.filename}}</a></td><td>{{display.get(r.final_class,r.final_class)}}</td><td>{{r.quality}}</td><td>{{r.severity}}</td></tr>{% endfor %}</table>{% endblock %}
